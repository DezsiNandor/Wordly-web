<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Book / Cards Graphic Shape -->
  <g filter="url(#dropShadow)" fill="#ffffff">
    <!-- Letters "WL" Stylized -->
    <text x="256" y="310" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="210" text-anchor="middle" fill="#ffffff" letter-spacing="-8">WL</text>
  </g>

  <!-- Wordly small subtitle badge inside icon -->
  <rect x="156" y="356" width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.2" />
  <text x="256" y="386" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" text-anchor="middle" fill="#ffffff" letter-spacing="4">WORDLY</text>

  <!-- Sparkle top right -->
  <path d="M 390 110 Q 390 140 420 140 Q 390 140 390 170 Q 390 140 360 140 Q 390 140 390 110 Z" fill="#fbbf24" />
</svg>
